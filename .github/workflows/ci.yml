name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu-training:
    name: CPU training smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trainer
        uses: actions/checkout@v4

      - name: Checkout variant-nnue-tools
        id: tools
        uses: actions/checkout@v4
        with:
          repository: fairy-stockfish/variant-nnue-tools
          path: variant-nnue-tools

      - name: Cache engine binary
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: variant-nnue-tools/src/stockfish
          key: engine-${{ runner.os }}-${{ steps.tools.outputs.commit }}

      - name: Build engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        working-directory: variant-nnue-tools/src
        run: make -j$(nproc) ARCH=x86-64-modern build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-CPU.txt

      - name: Install Python dependencies
        run: pip install -r requirements-CPU.txt

      - name: Build data loader
        run: sh compile_data_loader.bat

      - name: Feature transformer tests
        run: python tests/test_feature_transformer.py

      - name: PRP reader and batch tests
        run: |
          cmake -S . -B build -DBUILD_PRP_TESTS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          python -m unittest discover -s tests -p 'test_prp_*.py' -v
          python -m unittest discover -s tests -p test_score_targets.py -v
          python -m unittest discover -s tests -p test_record_bytes.py -v
          python -m unittest discover -s tests -p test_generic_loader.py -v

      - name: End-to-end training smoke test
        run: scripts/cpu_smoke_test.sh variant-nnue-tools/src/stockfish smoke_test

  generic-binaries:
    name: Generic loader (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the generic library once
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_PRP_TESTS=ON -DCMAKE_INSTALL_PREFIX=.
          cmake --build build --config Release --parallel 2 --target install
          ctest --test-dir build -C Release --output-on-failure
      - name: Install test dependencies
        run: python -m pip install -r requirements-CPU.txt
      - name: Runtime variant and record tests
        run: |
          python -m unittest discover -s tests -p test_generic_loader.py -v
          python -m unittest discover -s tests -p test_record_bytes.py -v
          python -m unittest discover -s tests -p 'test_prp_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: generic-loader-${{ runner.os }}-${{ runner.arch }}
          path: |
            *training_data_loader.dll
            *training_data_loader.so
            *training_data_loader.dylib
            variant.json
            configs/metal-chess.json
          if-no-files-found: error
